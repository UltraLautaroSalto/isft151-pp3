<!DOCTYPE html>
<html>

    <title>PROTOTIPO DE REGISTRO DE ASISTENCIA ESCOLAR</title>

    <link rel="stylesheet" href="prototype_1.css"/>
    <body id="Cuerpo_Principal">
        <section id="PaginaInicial">
            <head>
                <h1>Bienvenido</h1>
            </head>

            <h2>SELECCIONE UNA OPCION</h2>
                <button id="Boton_Ingreso_Estudiante_1">Estudiante</button>
                <button id="Boton_Ingreso_Docente_1">Docente</button>
        </section>

        <section id="IniciodeSesion_Estudiante_2" class="oculto">
            <h2>Porfavor ingrese su informacion a continuacion:</h2>
            <p>Ingrese su Nombre <input id="NM_Estudiante"></p>
            <p>Ingrese su ID Estudiantil: <input type ="number" id="ID_Estudiantil"></p>

            <p><button id="IniciarSesion_Alumno">Comprobar Identidad</button></p>
            <p><li><button class="Opcion_Volver">VOLVER ATRAS</button></li></p>

            <p id="MensajeIdentidadConfirmadaALM"></p>
        </section>

        <section id = "IniciodeSesion_Docente_2" class="oculto">
            <br>
            <p>Ingrese su Nombre y Contraseña</p>
            <p>NOMBRE: <input type="text" id="NM_Docente"></p>
            <p>CONTRASEÑA: <input type="text" id="CDG_Docente"></p>

            <p><button id="IniciarSesion_Docente">CONFIRMAR</button></p>
            <p><li><button class="Opcion_Volver">VOLVER ATRAS</button></li></p>
            <p id="MensajeIdentidadConfirmadaDOC"></p>
        </section>
    </body>

    <script src="prototype_1.js"></script>
</html>
